name: Waiver wire analysis

# Tuesdays at 8am Eastern, so the analysis is on the hub before the Tuesday
# recaps get written and shared.
#
# GitHub cron is UTC and has no idea DST exists, so 8am ET is two different UTC
# hours depending on the month. Both are listed:
#   12:00 UTC = 8am EDT (Mar-Nov)     13:00 UTC = 8am EST (Nov-Mar)
# and the guard below runs whichever entry matches the offset in force today,
# skipping the other. `github.event.schedule` hands the job the exact cron
# string that fired it, which is what makes this work: a delayed run still knows
# which entry it was. A guard that instead compared the CURRENT Eastern hour to
# 8 would skip BOTH entries on a morning GitHub ran the job an hour late, which
# it does under load -- and the failure would be silent.
on:
  schedule:
    - cron: '0 12 * * 2'   # 8am EDT
    - cron: '0 13 * * 2'   # 8am EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waivers
  cancel-in-progress: false

jobs:
  waivers:
    runs-on: ubuntu-latest
    steps:
      - name: Is this the entry that means 8am Eastern today?
        id: when
        run: |
          ZONE=$(TZ=America/New_York date +%Z)
          FIRED='${{ github.event.schedule }}'
          GO=no
          if [ '${{ github.event_name }}' != 'schedule' ]; then
            GO=yes                                        # manual run, always go
          elif [ "$FIRED" = '0 12 * * 2' ] && [ "$ZONE" = 'EDT' ]; then
            GO=yes
          elif [ "$FIRED" = '0 13 * * 2' ] && [ "$ZONE" = 'EST' ]; then
            GO=yes
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Eastern is currently $ZONE; this run came from '$FIRED'; go=$GO"
          echo "Eastern clock: $(TZ=America/New_York date)"

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'yes'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.go == 'yes'
        with:
          python-version: '3.12'

      # requests is the only dependency, and it is the only one the repo has.
      # Nothing here is a build step for the site; see CLAUDE.md.
      - name: Install requests
        if: steps.when.outputs.go == 'yes'
        run: pip install --quiet requests

      # --refresh because the whole job is about the latest claims, and the
      # on-disk cache is only ever correct for finished weeks.
      - name: Build the waiver analysis
        if: steps.when.outputs.go == 'yes'
        run: python scripts/build_waivers.py --refresh

      - name: Commit if anything changed
        if: steps.when.outputs.go == 'yes'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*/waivers.json
          # `generated` changes on every run, so an unchanged analysis would
          # still commit. Only ship it when a real number moved.
          if git diff --cached --quiet; then
            echo 'nothing changed'
            exit 0
          fi
          if [ "$(git diff --cached --numstat | wc -l)" = "1" ] && \
             [ "$(git diff --cached -U0 | grep -c '^[+-] ')" -le 2 ]; then
            echo 'only the timestamp moved; not committing'
            git reset
            exit 0
          fi
          git commit -m 'Waiver wire analysis: automated Tuesday refresh'
          # The bot pushes to main, and a human may have pushed since the job
          # started. Rebase rather than fail the run on a race.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
